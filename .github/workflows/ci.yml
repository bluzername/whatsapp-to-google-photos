name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl shellcheck
      - run: pip install pytest pytest-cov ruff
      - run: ruff check scripts tests
      - run: shellcheck scripts/*.sh
      - run: pytest --cov=scripts --cov-report=term-missing
